[project]
name = "nonebot-plugin-cnrail"
dynamic = ["version"]
description = "NoneBot2 plugin for query the train time table"
authors = [
    { name = "LgCuwukii", email = "lgc2333@126.com" },
    { name = "XieXiLin", email = "support@xiexilin.com" },
    { name = "MovFish" },
]
dependencies = [
    "nonebot2>=2.5.0",
    "httpx>=0.28.1",
    "materialyoucolor>=3.0.3",
    "nonebot-plugin-alconna>=0.62.1",
    "nonebot-plugin-htmlrender>=0.6.7,<0.8",
    "jinja2>=3.1.6",
    "pytz>=2026.3.post1",
    "cookit[jinja,loguru,playwright,pyd]>=0.13.3",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
homepage = "https://github.com/lgc-NB2Dev/nonebot-plugin-cnrail"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "nonebot_plugin_cnrail/__init__.py"
